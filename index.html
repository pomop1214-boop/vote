<div id="root"></div>

</script>
<!-- ▲▲▲ 위 두 줄만 수정하면 끝 ▲▲▲ -->

<script type="text/babel">
const { useState, useEffect } = React;

const STATUS = {
  yes: { label: "참석", color: "#2f7d4f", bg: "#e6f4ea" },
  no: { label: "불참", color: "#b23b3b", bg: "#fbe9e9" },
};

// 활동 항목 색/이모지 팔레트 (관리자가 추가할 때 순서대로 배정)
const ACT_PALETTE = [
  { emoji: "🎬", color: "#c2632b", bg: "#fbede2" },
  { emoji: "🖼️", color: "#7a4ea0", bg: "#f1eaf7" },
  { emoji: "🍽️", color: "#2f7d4f", bg: "#e6f4ea" },
  { emoji: "🎳", color: "#2f6ca0", bg: "#e6eef7" },
  { emoji: "🎤", color: "#b23b7a", bg: "#fbe9f2" },
];

// 기본 설정 (Supabase에 저장된 설정이 없을 때 사용)
const DEFAULT_CONFIG = {
  title: "모임 참석 체크",
  practiceRange: "14:00 - 17:00",
  practiceTimes: ["14:00", "15:00"],
  deadline: "2026-07-08T12:00", // datetime-local 형식
  activityOn: false,
  activities: [
    { key: "movie", label: "영화", sub: "토이스토리 5 등" },
    { key: "exhibit", label: "전시회", sub: "키크니 (후기 좋음)" },
  ],
};

const ADMIN_PIN = "0000"; // 관리자 설정 편집용 PIN (원하면 이 값을 바꾸세요)

// Supabase
const sbReady =
  window.SUPABASE_URL &&
  window.SUPABASE_ANON_KEY &&
  !window.SUPABASE_URL.includes("여기에");
const sb = sbReady
  ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
  : null;

function parseDeadline(str) {
  // "2026-07-08T12:00" -> Date
  if (!str) return new Date(2100, 0, 1);
  const d = new Date(str);
  return isNaN(d.getTime()) ? new Date(2100, 0, 1) : d;
}

function getRemaining(deadline) {
  const diff = deadline.getTime() - Date.now();
  if (diff <= 0) return { closed: true, h: 0, m: 0, s: 0 };
  const total = Math.floor(diff / 1000);
  return {
    closed: false,
    h: Math.floor(total / 3600),
    m: Math.floor((total % 3600) / 60),
    s: total % 60,
  };
}

function fmtDeadline(str) {
  const d = parseDeadline(str);
  const mm = d.getMonth() + 1;
  const dd = d.getDate();
  const hh = d.getHours();
  const min = d.getMinutes();
  const ampm = hh < 12 ? "오전" : "오후";
  let h12 = hh % 12;
  if (h12 === 0) h12 = 12;
  const minStr = min === 0 ? "" : " " + min + "분";
  return mm + "월 " + dd + "일 " + ampm + " " + h12 + "시" + minStr;
}

function getMode() {
  const h = (window.location.hash || "").toLowerCase();
  return h.includes("summary") ? "summary" : "respond";
}

function actConfigToMap(activities) {
  const map = {};
  (activities || []).forEach((a, i) => {
    const p = ACT_PALETTE[i % ACT_PALETTE.length];
    map[a.key] = { label: a.label, sub: a.sub, ...p };
  });
  return map;
}

async function fetchResponses() {
  if (!sb) return [];
  const { data, error } = await sb
    .from("responses")
    .select("*")
    .order("ts", { ascending: true });
  if (error) {
    console.error(error);
    return [];
  }
  return data || [];
}

async function fetchConfig() {
  if (!sb) return null;
  try {
    const { data, error } = await sb
      .from("config")
      .select("data")
      .eq("id", 1)
      .maybeSingle();
    if (error) {
      console.error(error);
      return null;
    }
    return data && data.data ? data.data : null;
  } catch (e) {
    console.error(e);
    return null;
  }
}

async function saveConfig(cfg) {
  if (!sb) return { error: { message: "Supabase 미설정" } };
  return await sb.from("config").upsert({ id: 1, data: cfg });
}

function AttendanceApp() {
  const [mode, setMode] = useState(getMode());
  const [config, setConfig] = useState(DEFAULT_CONFIG);
  const [responses, setResponses] = useState([]);
  const [loading, setLoading] = useState(true);

  const [name, setName] = useState("");
  const [practice, setPractice] = useState("");
  const [practiceTime, setPracticeTime] = useState("");
  const [afterparty, setAfterparty] = useState("");
  const [activity, setActivity] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const [sending, setSending] = useState(false);
  const [remaining, setRemaining] = useState(getRemaining(parseDeadline(DEFAULT_CONFIG.deadline)));

  const ACT = actConfigToMap(config.activities);

  useEffect(() => {
    const t = setInterval(
      () => setRemaining(getRemaining(parseDeadline(config.deadline))),
      1000
    );
    return () => clearInterval(t);
  }, [config.deadline]);

  useEffect(() => {
    const onHash = () => setMode(getMode());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const loadAll = async () => {
    const [cfg, res] = await Promise.all([fetchConfig(), fetchResponses()]);
    if (cfg) setConfig({ ...DEFAULT_CONFIG, ...cfg });
    setResponses(res);
    setLoading(false);
  };
  useEffect(() => {
    loadAll();
  }, []);
  useEffect(() => {
    if (mode !== "summary") return;
    const t = setInterval(async () => {
      const [cfg, res] = await Promise.all([fetchConfig(), fetchResponses()]);
      if (cfg) setConfig({ ...DEFAULT_CONFIG, ...cfg });
      setResponses(res);
    }, 4000);
    return () => clearInterval(t);
  }, [mode]);

  const activityOn = config.activityOn && (config.activities || []).length > 0;
  const timeNeeded = practice === "yes";
  const actNeeded = activityOn && afterparty === "yes";

  const submit = async () => {
    if (remaining.closed || sending) return;
    if (!name.trim() || !practice || !afterparty) return;
    if (timeNeeded && !practiceTime) return;
    if (actNeeded && !activity) return;
    if (!sb) {
      alert("Supabase 설정이 아직 안 됐어요.");
      return;
    }
    setSending(true);
    const entry = {
      name: name.trim(),
      practice,
      practice_time: timeNeeded ? practiceTime : "",
      afterparty,
      menu: actNeeded ? activity : "",
      ts: new Date().toISOString(),
    };
    await sb.from("responses").delete().ilike("name", name.trim());
    const { error } = await sb.from("responses").insert(entry);
    setSending(false);
    if (error) {
      alert("제출 중 오류가 났어요: " + error.message);
      return;
    }
    setSubmitted(true);
  };

  const reset = () => {
    setName("");
    setPractice("");
    setPracticeTime("");
    setAfterparty("");
    setActivity("");
    setSubmitted(false);
  };

  const remove = async (id) => {
    if (!sb) return;
    await sb.from("responses").delete().eq("id", id);
    loadAll();
  };

  const count = (field, val) =>
    responses.filter((r) => r[field] === val).length;
  const actCount = (val) => responses.filter((r) => r.menu === val).length;

  const canSubmit =
    name.trim() &&
    practice &&
    afterparty &&
    (!timeNeeded || practiceTime) &&
    (!actNeeded || activity);

  return (
    <div style={s.root}>
      <div style={s.card}>
        <header style={s.header}>
          <div style={s.tagRow}>
            <span style={s.modeTag}>
              {mode === "summary" ? "📊 집계 화면" : "✍️ 참석 응답"}
            </span>
          </div>
          <div style={s.logo}>{config.title}</div>
        </header>

        {!sbReady && <SetupNotice />}

        {loading ? (
          <div style={s.loading}>불러오는 중…</div>
        ) : mode === "summary" ? (
          <Summary
            config={config}
            setConfig={setConfig}
            ACT={ACT}
            responses={responses}
            count={count}
            actCount={actCount}
            onRemove={remove}
            onRefresh={loadAll}
          />
        ) : submitted ? (
          <div style={s.done}>
            <div style={s.checkCircle}>✓</div>
            <h2 style={s.doneTitle}>응답 완료!</h2>
            <p style={s.doneSub}>
              <b>{name}</b>님의 참석 여부가 저장됐어요.
            </p>
            <div style={s.doneRow}>
              <span>연습실</span>
              <span style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <Badge status={practice} />
                {practice === "yes" && practiceTime && (
                  <span style={s.timeChip}>{practiceTime}</span>
                )}
              </span>
            </div>
            <div style={s.doneRow}>
              <span>뒤풀이</span>
              <Badge status={afterparty} />
            </div>
            {actNeeded && activity && (
              <div style={s.doneRow}>
                <span>활동</span>
                <ActBadge act={activity} ACT={ACT} />
              </div>
            )}
            <button className="opt-btn" style={s.primaryBtn} onClick={reset}>
              다른 사람도 응답하기
            </button>
          </div>
        ) : (
          <div style={s.form}>
            <CountdownBanner remaining={remaining} config={config} />
            <p style={s.intro}>연습실·뒤풀이 참석 여부를 알려주세요.</p>

            <label style={s.label}>이름</label>
            <input
              style={s.input}
              placeholder="이름을 입력하세요"
              value={name}
              onChange={(e) => setName(e.target.value)}
            />

            <label style={s.label}>
              연습실 참여{" "}
              <span style={s.labelTime}>( {config.practiceRange} )</span>
            </label>
            <OptionGroup value={practice} onChange={setPractice} />

            {timeNeeded && (config.practiceTimes || []).length > 0 && (
              <React.Fragment>
                <label style={s.label}>연습실 참석 시간</label>
                <div style={s.optGroup}>
                  {config.practiceTimes.map((t) => {
                    const active = practiceTime === t;
                    return (
                      <button
                        key={t}
                        className="opt-btn"
                        style={{
                          ...s.opt,
                          borderColor: active ? "#2f7d4f" : "#ddd",
                          background: active ? "#e6f4ea" : "#fff",
                          color: active ? "#2f7d4f" : "#666",
                          fontWeight: active ? 700 : 500,
                        }}
                        onClick={() => setPracticeTime(t)}
                      >
                        {t}
                      </button>
                    );
                  })}
                </div>
              </React.Fragment>
            )}

            <label style={s.label}>뒤풀이 참여</label>
            <OptionGroup value={afterparty} onChange={setAfterparty} />

            {actNeeded && (
              <React.Fragment>
                <label style={s.label}>하고싶은 활동 선택</label>
                <div style={s.menuGroup}>
                  {(config.activities || []).map((a) => {
                    const cfg = ACT[a.key];
                    const active = activity === a.key;
                    return (
                      <button
                        key={a.key}
                        className="opt-btn"
                        style={{
                          ...s.menuOpt,
                          borderColor: active ? cfg.color : "#ddd",
                          background: active ? cfg.bg : "#fff",
                        }}
                        onClick={() => setActivity(a.key)}
                      >
                        <span style={s.menuEmoji}>{cfg.emoji}</span>
                        <span
                          style={{
                            ...s.menuLabel,
                            color: active ? cfg.color : "#3a2e1c",
                            fontWeight: active ? 700 : 600,
                          }}
                        >
                          {cfg.label}
                        </span>
                        {cfg.sub && <span style={s.menuSub}>{cfg.sub}</span>}
                      </button>
                    );
                  })}
                </div>
              </React.Fragment>
            )}

            <button
              className="opt-btn"
              style={{
                ...s.primaryBtn,
                background: remaining.closed ? "#b0a48a" : "#c2632b",
                opacity: remaining.closed ? 1 : canSubmit && !sending ? 1 : 0.4,
                cursor: remaining.closed ? "not-allowed" : "pointer",
              }}
              onClick={submit}
              disabled={remaining.closed || sending}
            >
              {remaining.closed
                ? "투표가 마감되었습니다"
                : sending
                ? "제출 중…"
                : "제출하기"}
            </button>
          </div>
        )}
      </div>

      {mode !== "summary" ? (
        <p style={s.foot}>
          이 링크는 <b>참석 응답용</b>입니다. 단체방에 그대로 공유하세요.
        </p>
      ) : (
        <div style={s.linkBox}>
          <div style={s.linkTitle}>🔗 응답용 링크 공유하기</div>
          <p style={s.linkDesc}>
            지금 보고 있는 이 집계 주소에서 끝의 <b>#summary</b>를 뺀 주소가
            응답용 링크예요.
          </p>
          <button
            className="opt-btn"
            style={s.copyBtn}
            onClick={() => {
              const respondLink =
                window.location.origin + window.location.pathname;
              if (navigator.clipboard) navigator.clipboard.writeText(respondLink);
              alert("응답용 링크가 복사됐어요:\n" + respondLink);
            }}
          >
            응답용 링크 복사
          </button>
        </div>
      )}
    </div>
  );
}

function SetupNotice() {
  return (
    <div style={s.setup}>
      <b>⚙️ 설정 필요</b> — Supabase URL/KEY를 채워야 저장됩니다.
    </div>
  );
}

function CountdownBanner({ remaining, config }) {
  if (remaining.closed) {
    return (
      <div style={{ ...s.banner, background: "#fbe9e9", borderColor: "#e8c4c4" }}>
        <div style={{ ...s.bannerLabel, color: "#b23b3b" }}>⏰ 투표 마감</div>
        <div style={{ ...s.bannerSub, color: "#b23b3b" }}>
          {fmtDeadline(config.deadline)} 마감 시간이 지났어요.
        </div>
      </div>
    );
  }
  const pad = (n) => String(n).padStart(2, "0");
  return (
    <div style={s.banner}>
      <div style={s.bannerLabel}>⏳ 투표 마감까지</div>
      <div style={s.bannerTime}>
        {remaining.h > 0 && <Unit value={remaining.h} label="시간" />}
        <Unit value={pad(remaining.m)} label="분" />
        <Unit value={pad(remaining.s)} label="초" />
      </div>
      <div style={s.bannerSub}>
        {fmtDeadline(config.deadline)}까지 응답해 주세요
      </div>
    </div>
  );
}
function Unit({ value, label }) {
  return (
    <span style={s.unit}>
      <span style={s.unitNum}>{value}</span>
      <span style={s.unitLabel}>{label}</span>
    </span>
  );
}
function OptionGroup({ value, onChange }) {
  return (
    <div style={s.optGroup}>
      {Object.entries(STATUS).map(([key, cfg]) => {
        const active = value === key;
        return (
          <button
            key={key}
            className="opt-btn"
            style={{
              ...s.opt,
              borderColor: active ? cfg.color : "#ddd",
              background: active ? cfg.bg : "#fff",
              color: active ? cfg.color : "#666",
              fontWeight: active ? 700 : 500,
            }}
            onClick={() => onChange(key)}
          >
            {cfg.label}
          </button>
        );
      })}
    </div>
  );
}
function Badge({ status }) {
  const cfg = STATUS[status] || STATUS.yes;
  return (
    <span style={{ background: cfg.bg, color: cfg.color, padding: "3px 12px", borderRadius: 20, fontSize: 13, fontWeight: 700 }}>
      {cfg.label}
    </span>
  );
}
function ActBadge({ act, ACT }) {
  if (!act) return <span style={{ color: "#bbb", fontSize: 13 }}>-</span>;
  const cfg = ACT[act];
  if (!cfg) return <span style={{ color: "#bbb", fontSize: 13 }}>-</span>;
  return (
    <span style={{ background: cfg.bg, color: cfg.color, padding: "3px 12px", borderRadius: 20, fontSize: 13, fontWeight: 700 }}>
      {cfg.emoji} {cfg.label}
    </span>
  );
}

function Summary({ config, setConfig, ACT, responses, count, actCount, onRemove, onRefresh }) {
  const [showAdmin, setShowAdmin] = useState(false);

  const activityOn = config.activityOn && (config.activities || []).length > 0;

  const bars = [
    { field: "practice", title: "연습실 참여" },
    { field: "afterparty", title: "뒤풀이 참여" },
  ];
  const timeCount = (t) =>
    responses.filter((r) => r.practice === "yes" && r.practice_time === t).length;
  const totalPracticeYes = count("practice", "yes");
  const totalAct = (config.activities || []).reduce(
    (sum, a) => sum + actCount(a.key),
    0
  );

  return (
    <div style={s.summary}>
      <button
        className="opt-btn"
        style={s.adminToggle}
        onClick={() => setShowAdmin((v) => !v)}
      >
        ⚙️ 투표 항목 수정 {showAdmin ? "▲" : "▼"}
      </button>

      {showAdmin && (
        <AdminPanel
          config={config}
          setConfig={setConfig}
          onClose={() => setShowAdmin(false)}
        />
      )}

      {responses.length === 0 ? (
        <div style={s.empty}>
          아직 응답이 없어요.<br />
          응답용 링크를 공유하고 기다려보세요.
          <br />
          <br />
          <button className="opt-btn" style={s.refreshBtn} onClick={onRefresh}>
            새로고침
          </button>
        </div>
      ) : (
        <React.Fragment>
          {bars.map((b) => (
            <div key={b.field} style={s.statBlock}>
              <div style={s.statTitle}>{b.title}</div>
              <div style={s.statRow}>
                {Object.entries(STATUS).map(([key, cfg]) => {
                  const c = count(b.field, key);
                  const pct = Math.round((c / responses.length) * 100);
                  return (
                    <div key={key} style={s.statItem}>
                      <div style={{ ...s.statNum, color: cfg.color }}>{c}</div>
                      <div style={s.statLabel}>{cfg.label}</div>
                      <div style={s.barTrack}>
                        <div style={{ ...s.barFill, width: pct + "%", background: cfg.color }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}

          {(config.practiceTimes || []).length > 0 && (
            <div style={s.statBlock}>
              <div style={s.statTitle}>연습실 참석 시간대 (참석자 기준)</div>
              <div style={s.statRow}>
                {config.practiceTimes.map((t) => {
                  const c = timeCount(t);
                  const pct = totalPracticeYes ? Math.round((c / totalPracticeYes) * 100) : 0;
                  return (
                    <div key={t} style={s.statItem}>
                      <div style={{ ...s.statNum, color: "#2f7d4f" }}>{c}</div>
                      <div style={s.statLabel}>{t}</div>
                      <div style={s.barTrack}>
                        <div style={{ ...s.barFill, width: pct + "%", background: "#2f7d4f" }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {activityOn && (
            <div style={s.statBlock}>
              <div style={s.statTitle}>하고싶은 활동 (뒤풀이 참석 기준)</div>
              <div style={s.menuStatRow}>
                {(config.activities || []).map((a) => {
                  const cfg = ACT[a.key];
                  const c = actCount(a.key);
                  const pct = totalAct ? Math.round((c / totalAct) * 100) : 0;
                  return (
                    <div key={a.key} style={{ ...s.menuStatCard, background: cfg.bg }}>
                      <div style={s.menuStatTop}>
                        <span style={s.menuStatEmoji}>{cfg.emoji}</span>
                        <span style={{ ...s.menuStatName, color: cfg.color }}>{cfg.label}</span>
                      </div>
                      <div style={{ ...s.menuStatNum, color: cfg.color }}>{c}표</div>
                      <div style={s.menuBarTrack}>
                        <div style={{ ...s.barFill, width: pct + "%", background: cfg.color }} />
                      </div>
                      <div style={s.menuStatPct}>{pct}%</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <div style={s.tableHead}>
            <span style={s.tableTitle}>전체 응답 ({responses.length}명)</span>
            <button className="opt-btn" style={s.refreshBtnSm} onClick={onRefresh}>
              ↻ 새로고침
            </button>
          </div>
          <div style={s.table}>
            <div style={{ ...s.trow, ...s.thead }}>
              <span style={s.cName}>이름</span>
              <span style={s.cCol}>연습실</span>
              <span style={s.cCol}>뒤풀이</span>
              {activityOn && <span style={s.cMenu}>활동</span>}
              <span style={s.cDel}></span>
            </div>
            {responses
              .slice()
              .reverse()
              .map((r) => (
                <div key={r.id} className="row" style={s.trow}>
                  <span style={s.cName}>{r.name}</span>
                  <span style={s.cCol}>
                    <Badge status={r.practice} />
                    {r.practice === "yes" && r.practice_time && (
                      <div style={s.cellTime}>{r.practice_time}</div>
                    )}
                  </span>
                  <span style={s.cCol}>
                    <Badge status={r.afterparty} />
                  </span>
                  {activityOn && (
                    <span style={s.cMenu}>
                      <ActBadge act={r.menu} ACT={ACT} />
                    </span>
                  )}
                  <button className="opt-btn" style={s.delBtn} onClick={() => onRemove(r.id)} title="삭제">
                    ✕
                  </button>
                </div>
              ))}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function AdminPanel({ config, setConfig, onClose }) {
  const [authed, setAuthed] = useState(false);
  const [pin, setPin] = useState("");
  const [draft, setDraft] = useState(JSON.parse(JSON.stringify(config)));
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");

  if (!authed) {
    return (
      <div style={s.adminBox}>
        <div style={s.adminTitle}>관리자 확인</div>
        <p style={s.adminHint}>설정을 바꾸려면 PIN을 입력하세요.</p>
        <input
          style={s.input}
          type="password"
          placeholder="PIN"
          value={pin}
          onChange={(e) => setPin(e.target.value)}
        />
        <button
          className="opt-btn"
          style={s.adminBtn}
          onClick={() => {
            if (pin === ADMIN_PIN) setAuthed(true);
            else setMsg("PIN이 틀렸어요.");
          }}
        >
          확인
        </button>
        {msg && <div style={s.adminErr}>{msg}</div>}
      </div>
    );
  }

  const up = (patch) => setDraft((d) => ({ ...d, ...patch }));

  const setTimeAt = (i, val) => {
    const arr = [...draft.practiceTimes];
    arr[i] = val;
    up({ practiceTimes: arr });
  };
  const addTime = () => up({ practiceTimes: [...draft.practiceTimes, ""] });
  const delTime = (i) =>
    up({ practiceTimes: draft.practiceTimes.filter((_, idx) => idx !== i) });

  const setActAt = (i, field, val) => {
    const arr = draft.activities.map((a, idx) =>
      idx === i ? { ...a, [field]: val } : a
    );
    up({ activities: arr });
  };
  const addAct = () =>
    up({
      activities: [
        ...(draft.activities || []),
        { key: "act" + Date.now(), label: "", sub: "" },
      ],
    });
  const delAct = (i) =>
    up({ activities: draft.activities.filter((_, idx) => idx !== i) });

  const save = async () => {
    setSaving(true);
    setMsg("");
    // 빈 시간/활동 정리
    const clean = {
      ...draft,
      practiceTimes: (draft.practiceTimes || []).filter((t) => t.trim()),
      activities: (draft.activities || []).filter((a) => a.label.trim()),
    };
    const { error } = await saveConfig(clean);
    setSaving(false);
    if (error) {
      setMsg("저장 실패: " + error.message);
      return;
    }
    setConfig(clean);
    setMsg("저장됐어요! 응답 화면에 바로 반영됩니다.");
  };

  return (
    <div style={s.adminBox}>
      <div style={s.adminTitle}>투표 항목 수정</div>

      <label style={s.aLabel}>제목</label>
      <input
        style={s.input}
        value={draft.title}
        onChange={(e) => up({ title: e.target.value })}
      />

      <label style={s.aLabel}>연습실 시간 범위 표기</label>
      <input
        style={s.input}
        value={draft.practiceRange}
        onChange={(e) => up({ practiceRange: e.target.value })}
        placeholder="예: 14:00 - 17:00"
      />

      <label style={s.aLabel}>연습실 참석 시간 선택지</label>
      {(draft.practiceTimes || []).map((t, i) => (
        <div key={i} style={s.aRow}>
          <input
            style={{ ...s.input, flex: 1 }}
            value={t}
            onChange={(e) => setTimeAt(i, e.target.value)}
            placeholder="예: 14:00"
          />
          <button className="opt-btn" style={s.aDel} onClick={() => delTime(i)}>
            삭제
          </button>
        </div>
      ))}
      <button className="opt-btn" style={s.aAdd} onClick={addTime}>
        + 시간 추가
      </button>

      <label style={s.aLabel}>마감 날짜/시간</label>
      <input
        style={s.input}
        type="datetime-local"
        value={draft.deadline}
        onChange={(e) => up({ deadline: e.target.value })}
      />

      <label style={s.aLabel}>
        <input
          type="checkbox"
          checked={!!draft.activityOn}
          onChange={(e) => up({ activityOn: e.target.checked })}
          style={{ marginRight: 8 }}
        />
        하고싶은 활동 항목 사용 (뒤풀이 참석자에게 표시)
      </label>

      {draft.activityOn && (
        <div style={s.actBox}>
          {(draft.activities || []).map((a, i) => (
            <div key={i} style={s.actEditRow}>
              <input
                style={{ ...s.input, marginBottom: 6 }}
                value={a.label}
                onChange={(e) => setActAt(i, "label", e.target.value)}
                placeholder="활동 이름 (예: 영화)"
              />
              <div style={s.aRow}>
                <input
                  style={{ ...s.input, flex: 1 }}
                  value={a.sub}
                  onChange={(e) => setActAt(i, "sub", e.target.value)}
                  placeholder="설명 (예: 토이스토리 5 등)"
                />
                <button className="opt-btn" style={s.aDel} onClick={() => delAct(i)}>
                  삭제
                </button>
              </div>
            </div>
          ))}
          <button className="opt-btn" style={s.aAdd} onClick={addAct}>
            + 활동 추가
          </button>
        </div>
      )}

      <button
        className="opt-btn"
        style={{ ...s.saveBtn, opacity: saving ? 0.5 : 1 }}
        onClick={save}
        disabled={saving}
      >
        {saving ? "저장 중…" : "저장하기"}
      </button>
      {msg && <div style={s.adminMsg}>{msg}</div>}
    </div>
  );
}
